# Local LINE demo: the app is reachable only inside the compose network;
# the Cloudflare quick tunnel is the single public entry point.
#   docker compose up --build        # start; find the URL with:
#   docker compose logs tunnel       # look for https://....trycloudflare.com
#   docker compose down              # stop (the public URL disappears)
services:
  app:
    build: .
    env_file: .env
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: "8000"
      CHAT_API_ENABLED: "false"   # public mode: only /webhooks/line and /health
    restart: unless-stopped
    # No "ports:" on purpose: nothing is opened on the host machine.

  tunnel:
    image: cloudflare/cloudflared:2026.11.1
    # http2 avoids networks that block cloudflared's default QUIC (UDP).
    command: tunnel --no-autoupdate --protocol http2 --url http://app:8000
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
